<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';

  function initProfile3D() {
    const container = document.getElementById('ne-container');
    if (!container) return;
    
    // 이미 캔버스가 생성되었는지 확인 (중복 생성 방지)
    if (container.querySelector('canvas')) return;

    const width = container.clientWidth;
    const height = container.clientHeight;
    
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
    camera.position.set(0, 0, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 조명
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const pointLight = new THREE.PointLight(0xffffff, 2);
    pointLight.position.set(50, 50, 50);
    scene.add(pointLight);

    // "n" 필기체 형태의 곡선
    const curvePoints = [
      new THREE.Vector3(-40, -20, 0), new THREE.Vector3(-40, 20, 0),
      new THREE.Vector3(-10, 0, 0), new THREE.Vector3(20, 20, 0),
      new THREE.Vector3(20, -20, 0)
    ];
    const curve = new THREE.CatmullRomCurve3(curvePoints);
    const geometry = new THREE.TubeGeometry(curve, 64, 10, 32, false);
    
    const material = new THREE.MeshPhysicalMaterial({
      color: 0x88ccff,
      transmission: 0.8,
      roughness: 0.05,
      metalness: 0.1,
      transparent: true,
      opacity: 0.9
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    function animate() {
      requestAnimationFrame(animate);
      mesh.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
  }

  // 로드 후 즉시 실행
  initProfile3D();
</script>
