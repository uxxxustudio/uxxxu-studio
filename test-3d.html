<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UXXXU 3D Character Test</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
    }

    #character-wrap {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 42%, #202020 0%, #0b0b0b 48%, #020202 100%);
    }

    #character {
        width: 100%;
        height: 100%;
    }

    .label {
        position: absolute;
        left: 32px;
        bottom: 28px;
        z-index: 10;

        font-family: Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: rgba(255,255,255,.55);
    }
</style>
</head>

<body>

<div id="character-wrap">
    <div id="character"></div>
    <div class="label">UXXXU.STUDIO / 3D CHARACTER TEST</div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';


// --------------------------------------------------
// SCENE
// --------------------------------------------------

const container = document.getElementById('character');

const scene = new THREE.Scene();


// --------------------------------------------------
// CAMERA
// --------------------------------------------------

const camera = new THREE.PerspectiveCamera(
    35,
    container.clientWidth / container.clientHeight,
    0.1,
    100
);

camera.position.set(0, 0.15, 6);


// --------------------------------------------------
// RENDERER
// --------------------------------------------------

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);


// --------------------------------------------------
// LIGHT
// --------------------------------------------------

const ambient = new THREE.AmbientLight(
    0xffffff,
    1.8
);

scene.add(ambient);


const light = new THREE.PointLight(
    0xffffff,
    5,
    12
);

light.position.set(
    2,
    3,
    5
);

scene.add(light);


// --------------------------------------------------
// CHARACTER GROUP
// --------------------------------------------------

const character = new THREE.Group();

character.position.y = -0.15;

scene.add(character);


// --------------------------------------------------
// MATERIALS
// --------------------------------------------------

const glassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xf3f3f3,
    transparent: true,
    opacity: 0.18,
    roughness: 0.15,
    metalness: 0,
    transmission: 0.25,
    thickness: 0.5,
    side: THREE.DoubleSide
});


const lineMaterial = new THREE.LineBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.65
});


const darkMaterial = new THREE.MeshBasicMaterial({
    color: 0x111111,
    transparent: true,
    opacity: 0.9
});


// --------------------------------------------------
// HEAD
// --------------------------------------------------

const headGeometry = new THREE.SphereGeometry(
    1.05,
    32,
    24
);

const head = new THREE.Mesh(
    headGeometry,
    glassMaterial
);

head.scale.set(
    0.88,
    1.05,
    0.82
);

head.position.y = 0.85;

character.add(head);


// HEAD WIREFRAME

const headEdges = new THREE.EdgesGeometry(
    headGeometry,
    18
);

const headLine = new THREE.LineSegments(
    headEdges,
    lineMaterial
);

headLine.scale.copy(head.scale);
headLine.position.copy(head.position);

character.add(headLine);


// --------------------------------------------------
// HAIR
// --------------------------------------------------

const hairGeometry = new THREE.SphereGeometry(
    1.08,
    32,
    18,
    0,
    Math.PI * 2,
    0,
    Math.PI * 0.58
);

const hair = new THREE.Mesh(
    hairGeometry,
    darkMaterial
);

hair.scale.set(
    0.9,
    0.72,
    0.84
);

hair.position.set(
    0,
    1.58,
    0
);

character.add(hair);


// --------------------------------------------------
// NECK
// --------------------------------------------------

const neckGeometry = new THREE.CylinderGeometry(
    0.38,
    0.45,
    0.55,
    24
);

const neck = new THREE.Mesh(
    neckGeometry,
    glassMaterial
);

neck.position.y = -0.05;

character.add(neck);


// --------------------------------------------------
// BODY
// --------------------------------------------------

const bodyGeometry = new THREE.SphereGeometry(
    1,
    32,
    20
);

const body = new THREE.Mesh(
    bodyGeometry,
    glassMaterial
);

body.scale.set(
    1.48,
    0.9,
    0.65
);

body.position.y = -0.65;

character.add(body);


// BODY WIREFRAME

const bodyEdges = new THREE.EdgesGeometry(
    bodyGeometry,
    20
);

const bodyLine = new THREE.LineSegments(
    bodyEdges,
    lineMaterial
);

bodyLine.scale.copy(body.scale);
bodyLine.position.copy(body.position);

character.add(bodyLine);


// --------------------------------------------------
// SUNGLASSES
// --------------------------------------------------

const glassesGroup = new THREE.Group();

glassesGroup.position.set(
    0,
    0.98,
    0.77
);

character.add(glassesGroup);


// left lens

function createLens(x) {

    const geometry =
        new THREE.CapsuleGeometry(
            0.30,
            0.28,
            8,
            16
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0x111111,
            transparent: true,
            opacity: 0.95
        });

    const lens = new THREE.Mesh(
        geometry,
        material
    );

    lens.scale.set(
        1.15,
        0.72,
        0.35
    );

    lens.rotation.z = Math.PI / 2;

    lens.position.x = x;

    glassesGroup.add(lens);
}

createLens(-0.38);
createLens(0.38);


// bridge

const bridgeGeometry =
    new THREE.BoxGeometry(
        0.28,
        0.08,
        0.06
    );

const bridge =
    new THREE.Mesh(
        bridgeGeometry,
        darkMaterial
    );

glassesGroup.add(bridge);


// --------------------------------------------------
// NOSE
// --------------------------------------------------

const noseGeometry =
    new THREE.ConeGeometry(
        0.13,
        0.4,
        16
    );

const nose =
    new THREE.Mesh(
        noseGeometry,
        glassMaterial
    );

nose.rotation.x = Math.PI / 2;

nose.position.set(
    0,
    0.62,
    0.82
);

character.add(nose);


// --------------------------------------------------
// MOUTH
// --------------------------------------------------

const mouthCurve =
    new THREE.EllipseCurve(
        0,
        0,
        0.25,
        0.12,
        0,
        Math.PI,
        false,
        0
    );

const mouthPoints =
    mouthCurve.getPoints(20);

const mouthGeometry =
    new THREE.BufferGeometry()
        .setFromPoints(mouthPoints);

const mouth =
    new THREE.Line(
        mouthGeometry,
        lineMaterial
    );

mouth.position.set(
    0,
    0.28,
    0.82
);

mouth.scale.set(
    1,
    0.55,
    1
);

character.add(mouth);


// --------------------------------------------------
// GREEN GLOW RING
// --------------------------------------------------

const ringGeometry =
    new THREE.TorusGeometry(
        1.42,
        0.025,
        12,
        96
    );

const ringMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x35ff82,
        transparent: true,
        opacity: 0.85
    });

const ring =
    new THREE.Mesh(
        ringGeometry,
        ringMaterial
    );

ring.rotation.x =
    Math.PI / 2;

ring.position.y = -0.05;

character.add(ring);


// --------------------------------------------------
// GREEN LIGHT BAND
// --------------------------------------------------

const bandGeometry =
    new THREE.TorusGeometry(
        1.46,
        0.045,
        12,
        96
    );

const band =
    new THREE.Mesh(
        bandGeometry,
        ringMaterial
    );

band.rotation.x =
    Math.PI / 2;

band.position.y = -0.82;

character.add(band);


// --------------------------------------------------
// CONTROLS
// --------------------------------------------------

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.enablePan = false;

controls.minDistance = 4;
controls.maxDistance = 8;

controls.target.set(
    0,
    0.25,
    0
);


// --------------------------------------------------
// ANIMATION
// --------------------------------------------------

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();

    // 아주 미세하게 떠 있는 움직임
    character.position.y =
        -0.15 + Math.sin(t * 0.8) * 0.025;

    // 천천히 회전
    character.rotation.y =
        Math.sin(t * 0.35) * 0.16;

    // 링 회전
    ring.rotation.z =
        t * 0.25;

    band.rotation.z =
        -t * 0.35;

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


// --------------------------------------------------
// RESIZE
// --------------------------------------------------

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            container.clientWidth /
            container.clientHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            container.clientWidth,
            container.clientHeight
        );

    }
);

</script>

</body>
</html>
