<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UXXXU 3D Character Test</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
    }

    #character-wrap {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 42%, #202020 0%, #0b0b0b 48%, #020202 100%);
    }

    #character {
        width: 100%;
        height: 100%;
    }

    .label {
        position: absolute;
        left: 32px;
        bottom: 28px;
        z-index: 10;

        font-family: Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: rgba(255,255,255,.55);
    }
</style>
</head>

<body>

<div id="character-wrap">
    <div id="character"></div>
    <div class="label">UXXXU.STUDIO / 3D CHARACTER TEST</div>
</div>

<script type="module" src="js/hero3d-test.js"></script>

</body>
</html>
